[package]
name = "bogominer"
description = "an open-source native bogosort miner for swapjs' bogostream."
authors = ["tomcat <hi@tomcat.sh>"]
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bogo"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
num_cpus = "1"
parking_lot = "0.12"
eframe = { version = "0.29", default-features = false, features = [
  "default_fonts",
  "glow"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true