name: Create Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-release-meta:
    name: Update release name & description
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cargo-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: cargo-version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - name: Find previous tag
        id: prev-tag
        run: |
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          PREV_TAG=$(git tag --sort=-creatordate \
                       | grep -v "^${CURRENT_TAG}$" \
                       | head -n 1)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"

      - name: Update release name and body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.cargo-version.outputs.version }}"
          PREV_TAG="${{ steps.prev-tag.outputs.prev_tag }}"
          EXISTING_BODY="${{ github.event.release.body }}"
          CHANGELOG=""

          if [ -n "$PREV_TAG" ]; then
            RANGE_HEADER="Changes since \`${PREV_TAG}\`"
          else
            RANGE_HEADER="Initial release commits"
          fi

          NEW_BODY=$(printf '%s\n\n%s\n\n## Commits — %s\n\n%s' \
            "$EXISTING_BODY" \
            "$(printf '%0.s-' {1..3})" \
            "$RANGE_HEADER" \
            "$CHANGELOG")

          gh release edit "${{ github.event.release.tag_name }}" \
            --title "bogominer v${VERSION}"

  build:
    name: Build — ${{ matrix.target }}
    needs: update-release-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (GNU, static-ish via musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: bogominer-linux-x86_64
            exe: bogominer

          # macOS — Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bogominer-macos-x86_64
            exe: bogominer

          # macOS — Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bogominer-macos-aarch64
            exe: bogominer

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bogominer-windows-x86_64
            exe: bogominer.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl toolchain needed on Linux for static builds
      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          ARCHIVE="${{ matrix.artifact }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" "$(basename $BINARY)"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\${{ matrix.exe }}"
          $archive = "${{ matrix.artifact }}.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
          "ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "${{ env.ASSET }}"
          --clobber
